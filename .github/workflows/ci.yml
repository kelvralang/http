name: Package CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: package-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ${{ matrix.target }} / Kelvra ${{ matrix.runtime_ref }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x86_64-gnu
            runtime_ref: main
          - runner: ubuntu-24.04-arm
            target: linux-arm64-gnu
            runtime_ref: main
          - runner: macos-14
            target: macos-arm64
            runtime_ref: main
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: kelvralang/kelvra
          ref: ${{ matrix.runtime_ref }}
          path: .runtime/kelvra
      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^\"]*\)"/\1/p' kelvra.toml | head -n 1)"
          test -n "$version"
          test -f LICENSE
          test -f package.api.kel
          test -f tests/test_http_package.sh
          grep -Fq "## $version" CHANGELOG.md
          grep -q '^```kelvra' README.md
          grep -Fq '"${{ matrix.target }}"' kelvra.toml
          grep -Fq "GNU GENERAL PUBLIC LICENSE" LICENSE
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$version"
          fi
      - name: Build Kelvra runtime
        run: |
          cmake -S .runtime/kelvra -B .runtime/kelvra/build \
            -DCMAKE_BUILD_TYPE=Release -DKELVRA_VERSION=0.2.0
          cmake --build .runtime/kelvra/build --parallel
      - name: Build, validate, and test package
        run: |
          ./tests/test_http_package.sh ./.runtime/kelvra/build/kelvra .

  validate:
    if: always()
    needs: [compatibility, sanitizers, valgrind]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require compatibility matrix
        env:
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          SANITIZER_RESULT: ${{ needs.sanitizers.result }}
          VALGRIND_RESULT: ${{ needs.valgrind.result }}
        run: |
          test "$COMPATIBILITY_RESULT" = success
          test "$SANITIZER_RESULT" = success
          test "$VALGRIND_RESULT" = success

  valgrind:
    name: Valgrind smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: kelvralang/kelvra
          ref: main
          path: .runtime/kelvra
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Build Kelvra runtime
        run: |
          cmake -S .runtime/kelvra -B .runtime/kelvra/build \
            -DCMAKE_BUILD_TYPE=Debug -DKELVRA_VERSION=0.2.0
          cmake --build .runtime/kelvra/build --target kelvra --parallel 2
      - name: Run Valgrind smoke suite
        env:
          KELVRA_HTTP_VALGRIND: "1"
          KELVRA_HTTP_CHURN_COUNT: "100"
        run: ./tests/test_http_package.sh ./.runtime/kelvra/build/kelvra .

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan
            mode: asan-ubsan
          - name: TSan smoke
            mode: tsan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: kelvralang/kelvra
          ref: main
          path: .runtime/kelvra
      - name: Build instrumented Kelvra runtime
        env:
          SANITIZER_MODE: ${{ matrix.mode }}
        run: |
          if [[ "$SANITIZER_MODE" == "asan-ubsan" ]]; then
            cmake -S .runtime/kelvra -B .runtime/kelvra/build \
              -DCMAKE_BUILD_TYPE=Debug -DKELVRA_VERSION=0.2.0 -DENABLE_ASAN=ON
          else
            cmake -S .runtime/kelvra -B .runtime/kelvra/build \
              -DCMAKE_BUILD_TYPE=Debug -DKELVRA_VERSION=0.2.0 \
              -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
              -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
              -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"
          fi
          cmake --build .runtime/kelvra/build --target kelvra --parallel 2
      - name: Run instrumented package suite
        env:
          KELVRA_HTTP_SANITIZER: ${{ matrix.mode }}
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: |
          if [[ "${{ matrix.mode }}" == "tsan" ]]; then
            sudo sysctl -w vm.mmap_rnd_bits=28
          fi
          ./tests/test_http_package.sh ./.runtime/kelvra/build/kelvra .
